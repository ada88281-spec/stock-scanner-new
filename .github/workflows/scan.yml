name: 盘后选股与盘前确认

on:
  schedule:
    - cron: '30 9 * * 1-5'   # 北京17:30
    - cron: '35 1 * * 1-5'   # 北京09:35
  workflow_dispatch:
    inputs:
      mode:
        description: 'scan 或 confirm'
        required: true
        default: 'scan'
        type: choice
        options: [scan, confirm]

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 执行
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python scan.py ${{ github.event.inputs.mode || 'scan' }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watchlist
          path: |
            watchlist.csv
            final_list.csv
